name: market-data

on:
  schedule:
    # שעות UTC, ימים שני–שישי (ימי המסחר בבורסה בת״א).
    # 16:17 UTC = 19:17 בשעון קיץ / 18:17 בשעון חורף — אחרי סגירת המסחר
    - cron: "17 16 * * 1-5"
    # ריצת גיבוי — מדלגת אם הנתונים של היום כבר נשמרו
    - cron: "47 19 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch market data
        # הרצה ידנית תמיד מושכת מחדש; הרצה מתוזמנת מדלגת אם היום כבר נשמר במלואו
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python fetch_market.py --out data
          else
            python fetch_market.py --out data --skip-if-exists
          fi

      - name: Compute spreads
        if: always()
        run: python spreads.py data

      - name: Historical spread stats + alerts
        # סטטיסטיקה מול ההיסטוריה הרבעונית (data/hist) ואיתור מרווחים חריגים; ההודעה נכתבת ל-data/hist/alert_message.txt
        if: always()
        run: |
          python hist/hist_spreads.py data
          python hist/intra_issuer.py data
          python hist/spread_alerts.py data

      - name: Telegram — מרווחים חריגים
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # נשלח רק אם יש התראות חדשות (הכיתוב לא ריק): הטבלה כתמונה (או כמה), ואז קובץ האקסל המלא
          [ -s data/hist/alert_message.txt ] || { echo "אין התראות חדשות"; exit 0; }
          python3 - <<'PY'
          import glob, json, os, sys, urllib.request, uuid
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not tok or not chat:
              print("::warning::TELEGRAM secrets missing — alert not sent"); sys.exit(0)
          caption = open("data/hist/alert_message.txt", encoding="utf-8").read()[:1000]
          def post(method, fields, files):
              b = uuid.uuid4().hex; body = b""
              for k, v in fields.items():
                  body += f"--{b}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n".encode()
              for k, path in files.items():
                  body += f"--{b}\r\nContent-Disposition: form-data; name=\"{k}\"; filename=\"{os.path.basename(path)}\"\r\nContent-Type: application/octet-stream\r\n\r\n".encode()
                  body += open(path, "rb").read() + b"\r\n"
              body += f"--{b}--\r\n".encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/{method}", body, {"Content-Type": f"multipart/form-data; boundary={b}"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: print(method, r.status)
              except urllib.error.HTTPError as e:
                  print("::error::telegram", method, e.code, e.read()[:300]); sys.exit(1)
          pngs = sorted(glob.glob("data/hist/alert_table*.png"))
          for i, png in enumerate(pngs):
              post("sendPhoto", {"chat_id": chat, "parse_mode": "HTML", "caption": caption if i == 0 else ""}, {"photo": png})
          if os.path.exists("data/hist/alert_table.xlsx"):
              post("sendDocument", {"chat_id": chat, "caption": "הטבלה המלאה (כולל שורות שלא נשלחו ולמה)"}, {"document": "data/hist/alert_table.xlsx"})
          PY

      - name: Commit data
        if: always()
        run: |
          git config user.name "market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "market data $(TZ=Asia/Jerusalem date +%F)"
            git pull --rebase --quiet || true
            git push
          fi

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug
          if-no-files-found: ignore
