name: market-data

on:
  schedule:
    # שעות UTC, ימים שני–שישי (ימי המסחר בבורסה בת״א).
    # 16:17 UTC = 19:17 בשעון קיץ / 18:17 בשעון חורף — אחרי סגירת המסחר
    - cron: "17 16 * * 1-5"
    # ריצת גיבוי — מדלגת אם הנתונים של היום כבר נשמרו
    - cron: "47 19 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch market data
        # הרצה ידנית תמיד מושכת מחדש; הרצה מתוזמנת מדלגת אם היום כבר נשמר במלואו
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python fetch_market.py --out data
          else
            python fetch_market.py --out data --skip-if-exists
          fi

      - name: Compute spreads
        if: always()
        run: python spreads.py data

      - name: Historical spread stats + alerts
        # סטטיסטיקה מול ההיסטוריה הרבעונית (data/hist) ואיתור מרווחים חריגים; ההודעה נכתבת ל-data/hist/alert_message.txt
        if: always()
        run: |
          python hist/hist_spreads.py data
          python hist/spread_alerts.py data

      - name: Telegram — מרווחים חריגים
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # נשלח רק אם יש התראות חדשות (הקובץ לא ריק); אותו בוט/צ'אט כמו corp-notify
          [ -s data/hist/alert_message.txt ] || { echo "אין התראות חדשות"; exit 0; }
          python3 - <<'PY'
          import json, os, sys, urllib.request
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          text = open("data/hist/alert_message.txt", encoding="utf-8").read()
          if not tok or not chat:
              print("::warning::TELEGRAM secrets missing — alert not sent"); sys.exit(0)
          parts, cur = [], ""
          for line in text.split("\n"):
              if len(cur) + len(line) + 1 > 3800:
                  parts.append(cur); cur = ""
              cur += line + "\n"
          parts.append(cur)
          for part in parts:
              body = json.dumps({"chat_id": chat, "text": part, "parse_mode": "HTML", "disable_web_page_preview": True}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/sendMessage", body, {"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("sent", r.status)
              except urllib.error.HTTPError as e:
                  print("::error::telegram", e.code, e.read()[:300]); sys.exit(1)
          PY

      - name: Commit data
        if: always()
        run: |
          git config user.name "market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "market data $(TZ=Asia/Jerusalem date +%F)"
            git pull --rebase --quiet || true
            git push
          fi

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug
          if-no-files-found: ignore
