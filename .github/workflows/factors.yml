name: factors

# גורמים חיצוניים רוחביים — מט״ח, ריביות, מדדי הלמ״ס, סחורות (factors.py) → data/factors/
on:
  schedule:
    - cron: "40 4 * * *"
    - cron: "40 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: factors
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: python3 factors.py csv data/factors
      - name: Commit
        run: |
          git config user.name "corp-factors-bot"; git config user.email "actions@github.com"
          git add data/factors
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "factors $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
