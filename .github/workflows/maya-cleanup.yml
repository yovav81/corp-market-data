name: maya-cleanup

# Deletes the throwaway maya-out/* result branches after Claude has collected them.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete maya-out branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in $(gh api "repos/${{ github.repository }}/branches?per_page=100" --jq '.[].name' | grep '^maya-out/' || true); do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" && echo "deleted $b"
          done
