name: tests

on:
  push:
    paths: ["gov/**", "corp/**", "short/**", "hist/**", "calc/**", "tests/**", "*.py", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt pytest
          sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc >/dev/null
      - name: Tests
        run: python -m pytest -q tests
