name: funds-prices

# מחירי פדיון יומיים של קרנות הנאמנות (אג״ח/מעורב/כספית) ממאיה → data/funds/prices.csv.gz (עדכון מצטבר) + רשימת כל הקרנות עם סיווג רשמי → maya_funds.csv.
on:
  schedule:
    - cron: "40 5 * * 1-5"     # ימים ב-ה 07:40 שעון ישראל (חורף) — מחירי יום המסחר הקודם
  workflow_dispatch:
    inputs:
      frm:
        description: "תאריך התחלה לקרנות חדשות (YYYY-MM-DD); ריק = 15 בדצמבר הקודם"
        default: ""
      funds:
        description: "קרנות נוספות (מספרים מופרדים בפסיק)"
        default: ""
      limit:
        description: "מגבלת קרנות לבדיקה (0 = הכל)"
        default: "0"
      backfill:
        description: "השלמת היסטוריה אחורה מ-frm לכל הקרנות (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: funds-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          bash .github/install_browser.sh
      - name: Fund list from Maya (classification, fees, Maya yields)
        run: python funds/maya_funds.py data || echo "maya_funds failed"
      - name: Fund prices from Maya
        env:
          FRM: ${{ inputs.frm }}
          FUNDS: ${{ inputs.funds }}
          LIMIT: ${{ inputs.limit || '0' }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        run: |
          ARGS=(data --limit "$LIMIT")
          [ "$BACKFILL" = "true" ] && ARGS+=(--backfill)
          [ -n "$FRM" ] && ARGS+=(--from "$FRM")
          [ -n "$FUNDS" ] && ARGS+=(--funds "$FUNDS")
          python funds/prices.py "${ARGS[@]}"
      - name: Commit data
        if: always()
        run: |
          git config user.name "funds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds/prices.csv.gz data/funds/prices_meta.json data/funds/maya_funds.csv data/funds/maya_funds_meta.json
          if ! git diff --cached --quiet; then
            git commit -m "fund prices $(TZ=Asia/Jerusalem date +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
