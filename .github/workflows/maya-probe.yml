name: maya-probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt requests
          python -m playwright install --with-deps chromium
      - name: Probe Maya
        run: python maya/probe.py probe_out
        continue-on-error: true
      - name: Publish results to a throwaway branch
        if: always()
        run: |
          BR="maya-out/probe-${{ github.run_id }}"
          cd probe_out
          git init -q -b "$BR"
          git config user.name "maya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe ${{ github.run_id }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BR"
