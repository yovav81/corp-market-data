name: maya-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt requests
          python -m playwright install --with-deps chromium
      - name: Probe Maya
        run: python maya/probe.py probe_out
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: maya-probe
          path: probe_out
          retention-days: 1
