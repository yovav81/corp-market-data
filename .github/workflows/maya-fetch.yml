name: maya-fetch

# Pulls a company's Maya (TASE) reports for the CORP bond models.
# Results are pushed to a throwaway branch maya-out/<run id>; Claude collects them and deletes the branch.
on:
  workflow_dispatch:
    inputs:
      company:
        description: "שם חברה או מספר חברה במאיה (למשל ביג או 1327)"
        required: true
      from:
        description: "מתאריך (YYYY-MM-DD). ריק = 3 שנים אחורה"
        default: ""
      mode:
        description: "download = להוריד קבצים, catalog = רק רשימת דיווחים"
        default: "download"
      all:
        description: "true = להוריד את כל הדיווחים, לא רק הרלוונטיים"
        default: "false"
      ids:
        description: "מספרי דיווח מופרדים בפסיק — להוריד רק אותם"
        default: ""

permissions:
  contents: write

concurrency:
  group: maya-fetch-${{ github.event.inputs.company }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Fetch from Maya
        env:
          COMPANY: ${{ inputs.company }}
          FROM: ${{ inputs.from }}
          MODE: ${{ inputs.mode }}
          ALL: ${{ inputs.all }}
          IDS: ${{ inputs.ids }}
        run: |
          ARGS=(--company "$COMPANY" --out maya_out --mode "$MODE")
          [ -n "$FROM" ] && ARGS+=(--from "$FROM")
          [ "$ALL" = "true" ] && ARGS+=(--all)
          [ -n "$IDS" ] && ARGS+=(--ids "$IDS")
          python maya/fetch.py "${ARGS[@]}"
      - name: Publish to a throwaway branch
        if: always()
        run: |
          [ -d maya_out ] || exit 0
          BR="maya-out/${{ github.run_id }}"
          cd maya_out
          git init -q -b "$BR"
          git config user.name "maya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "maya fetch ${{ github.run_id }}: ${{ inputs.company }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BR"
          echo "branch: $BR"
